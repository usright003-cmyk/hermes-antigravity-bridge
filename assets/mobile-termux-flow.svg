<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" width="920" height="490">
  <defs>
    <style>
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 12; ry: 12; }
      .header-bar { fill: #161b22; rx: 12; ry: 12; }
      .title { fill: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 600; text-anchor: middle; }
      .subtitle { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; text-anchor: middle; }
      .box { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 8; ry: 8; }
      .box-green { fill: #161b22; stroke: #3fb950; stroke-width: 2; rx: 8; ry: 8; }
      .box-blue { fill: #161b22; stroke: #58a6ff; stroke-width: 2; rx: 8; ry: 8; }
      .box-gold { fill: #161b22; stroke: #e3b341; stroke-width: 2; rx: 8; ry: 8; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; }
      .box-desc { font-family: "SF Mono", "Segoe UI Mono", Menlo, monospace; font-size: 11px; fill: #8b949e; }
      .tag { font-family: "SF Mono", "Segoe UI Mono", Menlo, monospace; font-size: 10px; font-weight: 600; }
      .arrow { stroke: #58a6ff; stroke-width: 2; stroke-linecap: round; }
      .arrow-green { stroke: #3fb950; stroke-width: 2; stroke-linecap: round; }
      .arrow-gold { stroke: #e3b341; stroke-width: 2; stroke-linecap: round; }
      .dot-red { fill: #ff5f56; }
      .dot-yellow { fill: #ffbd2e; }
      .dot-green { fill: #27c93f; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#58a6ff" />
    </marker>
    <marker id="arrowhead-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3fb950" />
    </marker>
    <marker id="arrowhead-gold" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e3b341" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="490" class="bg" />
  
  <!-- Header Bar -->
  <rect width="920" height="44" class="header-bar" />
  <circle cx="22" cy="22" r="6" class="dot-red" />
  <circle cx="42" cy="22" r="6" class="dot-yellow" />
  <circle cx="62" cy="22" r="6" class="dot-green" />
  <text x="460" y="24" class="title">📱 100% Standalone Android (Termux) Superintelligence Architecture</text>
  <text x="460" y="38" class="subtitle">Zero PC Dependency &#8226; Everything Runs on Smartphone &#8226; 1,000,000 Token DeepMind Context</text>

  <!-- Node 1: Termux Mobile Environment -->
  <rect x="30" y="65" width="260" height="180" class="box-green" />
  <text x="45" y="90" class="box-title" fill="#3fb950">📱 Android Phone (Termux)</text>
  <text x="45" y="110" class="box-desc">&#8226; PRoot Linux (Ubuntu ARM64)</text>
  <text x="45" y="130" class="box-desc">&#8226; Google Antigravity CLI (agy)</text>
  <text x="45" y="150" class="box-desc">&#8226; Hermes Agent CLI</text>
  <text x="45" y="170" class="box-desc">&#8226; Local memory.db (SQLite)</text>
  <text x="45" y="190" class="box-desc">&#8226; termux-api (SMS / Hardware)</text>
  <rect x="45" y="208" width="160" height="20" rx="4" fill="#238636" />
  <text x="52" y="222" class="tag" fill="#ffffff">Self-Contained On Phone</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="290" y1="155" x2="335" y2="155" class="arrow" marker-end="url(#arrowhead)" />
  <text x="295" y="145" class="tag" fill="#58a6ff">Loopback</text>

  <!-- Node 2: Local Bridge Daemon inside Phone -->
  <rect x="345" y="65" width="250" height="180" class="box-blue" />
  <text x="360" y="90" class="box-title" fill="#58a6ff">⚡ Local Bridge (127.0.0.1:8765)</text>
  <text x="360" y="110" class="box-desc">&#8226; Runs locally inside Termux</text>
  <text x="360" y="130" class="box-desc">&#8226; Subprocess `agy` IPC link</text>
  <text x="360" y="150" class="box-desc">&#8226; Token Authentication Shield</text>
  <text x="360" y="170" class="box-desc">&#8226; Strict Tool Sandboxing</text>
  <text x="360" y="190" class="box-desc">&#8226; Streaming SSE Chunking</text>
  <rect x="360" y="208" width="155" height="20" rx="4" fill="#1f6feb" />
  <text x="368" y="222" class="tag" fill="#ffffff">On-Device Local Daemon</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="595" y1="155" x2="640" y2="155" class="arrow-gold" marker-end="url(#arrowhead-gold)" />
  <text x="600" y="145" class="tag" fill="#e3b341">Mobile Data</text>

  <!-- Node 3: Google DeepMind Cloud -->
  <rect x="650" y="65" width="240" height="180" class="box-gold" />
  <text x="665" y="90" class="box-title" fill="#e3b341">☁️ Google AI Cloud</text>
  <text x="665" y="110" class="box-desc">&#8226; Gemini 3.8 Flash (High Think)</text>
  <text x="665" y="130" class="box-desc">&#8226; 1,000,000 Token Context</text>
  <text x="665" y="150" class="box-desc">&#8226; Claude Sonnet 4.6 Thinking</text>
  <text x="665" y="170" class="box-desc">&#8226; Zero Subscription / API fees</text>
  <text x="665" y="190" class="box-desc">&#8226; Pure Cloud Compute</text>
  <rect x="665" y="208" width="155" height="20" rx="4" fill="#9e6a03" />
  <text x="672" y="222" class="tag" fill="#ffffff">Infinite Context Core</text>

  <!-- Bottom Flow: The Round-Trip Superintelligence Stream -->
  <rect x="30" y="265" width="860" height="200" class="box" />
  <text x="45" y="293" class="box-title" fill="#3fb950">🚀 Daily Mobile Workflow: Just 1 Word on Your Phone</text>

  <!-- Step 1 -->
  <rect x="45" y="310" width="180" height="135" rx="6" fill="#21262d" stroke="#30363d" />
  <text x="55" y="331" class="tag" fill="#3fb950">1. OPEN TERMUX</text>
  <text x="55" y="353" class="box-desc">Open Termux on Android</text>
  <text x="55" y="373" class="box-desc">Type single command:</text>
  <text x="55" y="393" class="box-desc" fill="#3fb950">&gt; start-hermes</text>
  <text x="55" y="413" class="box-desc">No PC connection needed!</text>
  <text x="55" y="430" class="box-desc">Works on Wi-Fi or 4G/5G</text>

  <!-- Arrow -->
  <line x1="230" y1="375" x2="260" y2="375" class="arrow-green" marker-end="url(#arrowhead-green)" />

  <!-- Step 2 -->
  <rect x="265" y="310" width="180" height="135" rx="6" fill="#21262d" stroke="#30363d" />
  <text x="275" y="331" class="tag" fill="#58a6ff">2. AUTONOMOUS START</text>
  <text x="275" y="353" class="box-desc">Bridge starts on phone</text>
  <text x="275" y="373" class="box-desc">Port 8765 loopback</text>
  <text x="275" y="393" class="box-desc">Hermes loads phone DB</text>
  <text x="275" y="413" class="box-desc">Memory recalled instantly</text>
  <text x="275" y="430" class="box-desc">Prompts user for question</text>

  <!-- Arrow -->
  <line x1="450" y1="375" x2="480" y2="375" class="arrow" marker-end="url(#arrowhead)" />

  <!-- Step 3 -->
  <rect x="485" y="310" width="180" height="135" rx="6" fill="#21262d" stroke="#30363d" />
  <text x="495" y="331" class="tag" fill="#e3b341">3. DEEPMIND REASONING</text>
  <text x="495" y="353" class="box-desc">Phone sends request</text>
  <text x="495" y="373" class="box-desc">directly to Google Cloud</text>
  <text x="495" y="393" class="box-desc">Gemini 3.8 Flash 1M</text>
  <text x="495" y="413" class="box-desc">executes multi-step logic</text>
  <text x="495" y="430" class="box-desc">Zero tokens truncated</text>

  <!-- Arrow -->
  <line x1="670" y1="375" x2="700" y2="375" class="arrow-gold" marker-end="url(#arrowhead-gold)" />

  <!-- Step 4 -->
  <rect x="705" y="310" width="170" height="135" rx="6" fill="#21262d" stroke="#30363d" />
  <text x="715" y="331" class="tag" fill="#3fb950">4. STREAMED TO SCREEN</text>
  <text x="715" y="353" class="box-desc">Instant typewriter text</text>
  <text x="715" y="373" class="box-desc">streams right on mobile!</text>
  <text x="715" y="393" class="box-desc">Executes phone tools</text>
  <text x="715" y="413" class="box-desc">Saves new memory in DB</text>
  <text x="715" y="430" class="box-desc">Phone battery stays cool</text>
</svg>
