[build-system]
requires = ["setuptools>=68,<76", "wheel>=0.41,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-antigravity-bridge"
dynamic = ["version"]
description = "A local Hermes Agent integration for models exposed by the Antigravity CLI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ahmad Sabbir"}]
dependencies = [
  "tomli>=2.0,<3; python_version < '3.11'",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
keywords = [
  "hermes",
  "hermes-agent",
  "antigravity",
  "deepmind",
  "llm",
  "openai-compatible",
  "streaming",
  "ai-agents",
]

[project.urls]
Homepage = "https://github.com/usright003-cmyk/hermes-antigravity-bridge"
Documentation = "https://github.com/usright003-cmyk/hermes-antigravity-bridge#readme"
Repository = "https://github.com/usright003-cmyk/hermes-antigravity-bridge.git"
Issues = "https://github.com/usright003-cmyk/hermes-antigravity-bridge/issues"
Changelog = "https://github.com/usright003-cmyk/hermes-antigravity-bridge/releases"

[project.scripts]
hermes-antigravity-bridge = "hermes_antigravity_bridge.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "ruff>=0.6,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "hermes_antigravity_bridge.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
