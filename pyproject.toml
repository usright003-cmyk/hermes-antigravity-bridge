[build-system]
requires = ["setuptools>=68,<76", "wheel>=0.41,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-antigravity-bridge"
dynamic = ["version"]
description = "A local Hermes Agent integration for models exposed by the Antigravity CLI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ahmad Sabbir"}]
dependencies = [
  "tomli>=2.0,<3; python_version < '3.11'",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.scripts]
hermes-antigravity-bridge = "hermes_antigravity_bridge.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "ruff>=0.6,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "hermes_antigravity_bridge.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
