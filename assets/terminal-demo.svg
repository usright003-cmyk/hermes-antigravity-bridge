<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <style>
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 10; ry: 10; }
      .bar { fill: #161b22; rx: 10; ry: 10; }
      .bar-line { stroke: #30363d; stroke-width: 1; }
      .title { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 13px; font-weight: 500; text-anchor: middle; }
      .txt { font-family: "SF Mono", "Segoe UI Mono", "Roboto Mono", Menlo, Consolas, monospace; font-size: 13px; }
      .prompt { fill: #58a6ff; font-weight: 600; }
      .cmd { fill: #f0f6fc; font-weight: 600; }
      .gray { fill: #8b949e; }
      .blue { fill: #58a6ff; }
      .green { fill: #3fb950; font-weight: 600; }
      .purple { fill: #bc8cff; font-weight: 600; }
      .yellow { fill: #d29922; }
      .white { fill: #f0f6fc; }
      .cursor { fill: #58a6ff; animation: blink 1s infinite; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .card-bg { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 6; }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect width="800" height="450" class="bg" />
  <rect width="800" height="40" class="bar" />
  <line x1="0" y1="40" x2="800" y2="40" class="bar-line" />

  <!-- Window Controls -->
  <circle cx="20" cy="20" r="6" fill="#ff5f56" />
  <circle cx="40" cy="20" r="6" fill="#ffbd2e" />
  <circle cx="60" cy="20" r="6" fill="#27c93f" />
  <text x="400" y="25" class="title">hermes-agent &#8226; hermes-antigravity-bridge &#8226; 80x24</text>

  <!-- Terminal Body Content -->
  <!-- Line 1: pip install -->
  <text x="24" y="75" class="txt"><tspan class="prompt">user@host:~$</tspan> <tspan class="cmd">pip install hermes-antigravity-bridge</tspan></text>
  <text x="24" y="98" class="txt gray">Successfully installed hermes-antigravity-bridge-0.1.0</text>

  <!-- Line 2: start serve -->
  <text x="24" y="132" class="txt"><tspan class="prompt">user@host:~$</tspan> <tspan class="cmd">hermes-antigravity-bridge serve</tspan></text>
  <text x="24" y="156" class="txt"><tspan class="blue">[22:30:10 INFO]</tspan> <tspan class="white" font-weight="bold">Hermes Antigravity Bridge v0.1.0</tspan> starting...</text>
  <text x="24" y="178" class="txt"><tspan class="blue">[22:30:10 INFO]</tspan> Security gate: <tspan class="green">strict fail-closed (--sandbox --mode plan)</tspan></text>
  <text x="24" y="200" class="txt"><tspan class="blue">[22:30:10 INFO]</tspan> Models ready: <tspan class="purple">gemini-3.8-flash</tspan>, <tspan class="purple">gemini-3.1-pro</tspan></text>
  <text x="24" y="222" class="txt"><tspan class="blue">[22:30:10 INFO]</tspan> Bridge listening on <tspan class="green">http://127.0.0.1:8765</tspan> &#8226; <tspan class="green">Dashboard: /dashboard</tspan></text>

  <!-- Separator Line -->
  <line x1="24" y1="248" x2="776" y2="248" stroke="#30363d" stroke-dasharray="4 4" />

  <!-- Hermes Connection Section -->
  <text x="24" y="278" class="txt"><tspan class="purple">[Hermes Agent]</tspan> &lt;stream:open&gt; <tspan class="green">Typewriter Stream Active (TCP_NODELAY)</tspan></text>
  <text x="24" y="306" class="txt"><tspan class="white" font-weight="bold">Hermes:</tspan> <tspan class="white">"Connected to Gemini 3.8 Flash. MEMORY.md verified. Sovereignty: 100%."</tspan></text>
  <rect x="735" y="293" width="8" height="15" class="cursor" />

  <!-- Metric Badges / Footer Info Card -->
  <rect x="24" y="340" width="752" height="75" class="card-bg" />
  <text x="44" y="368" class="txt"><tspan class="gray">TELEMETRY &#8226;</tspan> <tspan class="green">&#9679; ONLINE</tspan> &#8226; <tspan class="blue">Throughput: 84 tokens/sec</tspan> &#8226; <tspan class="yellow">Latency: 3.8ms</tspan></text>
  <text x="44" y="394" class="txt"><tspan class="gray">ARCHITECTURE &#8226;</tspan> <tspan class="white">Stateless Ephemeral CWD</tspan> &#8226; <tspan class="white">100% Hermes Memory Ownership</tspan> &#8226; <tspan class="green">0 Errors</tspan></text>
</svg>